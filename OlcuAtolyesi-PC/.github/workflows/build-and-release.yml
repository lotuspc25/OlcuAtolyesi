name: Ölçü Atölyesi PC - Derleme ve Sürüm Dağıtımı

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Derleme ve Otomatik Testler
    runs-on: windows-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: .NET 10 SDK Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Bağımlılıkları Geri Yükle (Restore)
      run: dotnet restore OlcuAtolyesi.PC.sln

    - name: Debug Derlemesi
      run: dotnet build OlcuAtolyesi.PC.sln -c Debug --no-restore

    - name: Release Derlemesi
      run: dotnet build OlcuAtolyesi.PC.sln -c Release --no-restore

    - name: Otomatik Mantık, Geometri ve Navigasyon Testleri
      run: dotnet run --project tests/OlcuAtolyesi.PC.Tests/OlcuAtolyesi.PC.Tests.csproj -c Debug --no-build

  release-package:
    name: Bağımsız Taşınabilir Paket Üretimi ve Yayınlama
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: .NET 10 SDK Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Bağımsız (Self-Contained) Windows x64 Paketi Üret
      run: |
        dotnet publish src/OlcuAtolyesi.PC/OlcuAtolyesi.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/OlcuAtolyesi-PC-win-x64

    - name: Paketi Arşivle (.ZIP)
      run: |
        Compress-Archive -Path publish/OlcuAtolyesi-PC-win-x64/* -DestinationPath publish/OlcuAtolyesi-PC-win-x64.zip

    - name: GitHub Release Oluştur ve Yükle
      uses: softprops/action-gh-release@v2
      with:
        files: publish/OlcuAtolyesi-PC-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
