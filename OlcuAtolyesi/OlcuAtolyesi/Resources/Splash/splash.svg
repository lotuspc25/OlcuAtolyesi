    <path d="M 222 216 L 222 270 Q 242 252 254 216 Z" fill="#1E293B" stroke="#00ADB5" stroke-width="1.5"/>
    <line x1="222" y1="216" x2="222" y2="270" stroke="#00E5FF" stroke-width="2"/>
